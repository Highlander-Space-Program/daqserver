<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Clementine{% endblock %}</title>

    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='favicon-32x32.png') }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='favicon-16x16.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}?v=5" />
    <script src="{{ url_for('static', path='js/lib/chart.js') }}"></script>
</head>

<body>
    {% block content %}{% endblock %}

    <script src="{{ url_for('static', path='js/websocket.js') }}?v=6"></script>
    <script src="{{ url_for('static', path='js/state.js') }}?v=6"></script>
    <script src="{{ url_for('static', path='js/api.js') }}?v=6"></script>
    <script src="{{ url_for('static', path='js/charts.js') }}?v=5"></script>
    <script src="{{ url_for('static', path='js/render.js') }}?v=7"></script>
    <script src="{{ url_for('static', path='js/modals.js') }}?v=6"></script>
    <script src="{{ url_for('static', path='js/events.js') }}?v=5"></script>
    <script src="{{ url_for('static', path='js/app.js') }}?v=5"></script>
</body>
</html>
