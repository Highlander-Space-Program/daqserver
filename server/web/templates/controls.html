<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/controls.css') }}">
</head>

<body>
    <div class="page-layout">

        <!-- LEFT SIDE BUTTONS -->
        <aside class="sidebar">
            <button class="side-btn active">Control</button>
            <button class="side-btn">Data</button>
        </aside>

        <!-- MAIN PAGE -->
        <div class="container">
            <h1>Control Panel</h1>

            <!-- MQTT panel -->
            <section class="panel">
                <div class="panel-title">MQTT Connection</div>

                <div class="xbee-row">
                    <div class="left">
                        <span id="xbee-dot" class="dot gray"></span>
                        <span id="xbee-status">Disconnected</span>
                        <span id="xbee-port" class="subtitle"></span>
                    </div>

                    <div class="right">
                        <button onclick="connectXbee()">Connect</button>
                        <button onclick="disconnectXbee()">Disconnect</button>
                    </div>
                </div>
            </section>

            <!-- Top row -->
            <div class="top-row">

                <section class="panel">
                    <div class="panel-title">Board Statuses</div>

                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="board-status-body"></tbody>
                    </table>
                </section>

                <section class="panel">
                    <div class="panel-title">System Flags</div>

                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Armed</th>
                                <th>Arm</th>
                                <th>Disarm</th>
                            </tr>
                        </thead>
                        <tbody id="important-status-body"></tbody>
                    </table>
                </section>

                <section class="panel">
                    <div class="panel-title">Event Log</div>
                    <div id="event-log" class="log-box"></div>
                </section>

            </div>

           <!-- Bottom row -->
<div class="bottom-row launch-row">
    <section class="panel">
        <div class="panel-title">Servo Controls</div>

        <table>
            <thead>
                <tr>
                    <th>Servo</th>
                    <th>Status</th>
                    <th>Open</th>
                    <th>Close</th>
                </tr>
            </thead>
            <tbody id="servo-body"></tbody>
        </table>
    </section>

    <section class="panel">
        <div class="panel-title">Igniter Controls</div>

        <div class="igniter-box">
            <div>
                Status:
                <span id="igniter-status" class="status-box red">OFF</span>
            </div>

            <button class="danger-btn" onclick="fireIgniter()">Fire Igniter</button>
            <button onclick="shutoffIgniter()">Shut-off Igniter</button>
        </div>
    </section>

    <section class="panel">
        <div class="panel-title">Board Check</div>

        <div class="igniter-box">
            <button onclick="pingBoard()">Ping Board</button>

            <div>
                Breakwire:
                <span id="breakwire-status" class="status-box gray">UNKNOWN</span>
            </div>
        </div>
    </section>

</div>

        </div>
    </div>

    <script src="{{ url_for('static', path='js/controls.js') }}"></script>
