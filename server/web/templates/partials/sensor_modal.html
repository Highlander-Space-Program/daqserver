<div id="sensor-modal" class="modal hidden">
    <div class="modal-card">
        <div class="modal-header">
            <h2 id="sensor-modal-title">Add Sensor</h2>
            <button id="close-sensor-modal" class="close-btn">×</button>
        </div>

        <input id="sensor-name-input" type="text" placeholder="Sensor name" />

        <label>Port</label>
        <select id="sensor-port-input"></select>

        <label>Scaling Equation</label>
        <select id="sensor-equation-input"></select>

        <div class="form-actions">
            <button id="save-sensor-btn" class="primary-btn">Save Sensor</button>
        </div>
    </div>
</div>
