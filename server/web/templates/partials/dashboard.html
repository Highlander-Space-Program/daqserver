<section id="page-dashboard" class="page active">
    <div class="page-header">
        <div>
            <h2>Clementine Dashboard</h2>
            <p class="page-subtitle">DAQ page for live sensor graphs.</p>
        </div>
    </div>

    <div class="configure-row">
        <div class="metric-box">
            <select id="selected-graph-0" class="graph-value-select"></select>
            <div id="selected-value-0" class="metric-value neon-cyan">--</div>
        </div>

        <div class="metric-box">
            <select id="selected-graph-1" class="graph-value-select"></select>
            <div id="selected-value-1" class="metric-value neon-green">--</div>
        </div>

        <div class="metric-box">
            <select id="selected-graph-2" class="graph-value-select"></select>
            <div id="selected-value-2" class="metric-value neon-orange">---</div>
        </div>
    </div>

    <div id="dashboard-grid" class="dashboard-grid"></div>

    <div class="page-controls">
        <button id="prev-graph-page" class="secondary-btn">Previous</button>
        <span id="graph-page-label">Page 1 of 1</span>
        <button id="next-graph-page" class="secondary-btn">Next</button>
    </div>
