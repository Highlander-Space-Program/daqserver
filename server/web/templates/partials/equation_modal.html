<div id="equation-modal" class="modal hidden">
    <div class="modal-card">
        <div class="modal-header">
            <h2 id="equation-modal-title">Add Equation</h2>
            <button id="close-equation-modal" class="close-btn">×</button>
        </div>

        <input id="equation-name-input" type="text" placeholder="Equation name" />

        <textarea id="equation-code-input"></textarea>

        <div class="form-actions">
            <button id="save-equation-btn" class="primary-btn">Save Equation</button>
        </div>
    </div>
</div>
