[project]
name = "daqserver"
version = "0.1.0"
description = "The big daq server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.135.1",
    "influxdb3-python>=0.18.0",
    "labjack-ljm>=1.23.0",
    "paho-mqtt>=2.1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "rich>=14.3.3",
    "websockets>=16.0",
    "numpy>=1.26.0",
]

[tool.uv]
package = true

[project.scripts]
server = "server.__main__:main"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 82

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

# [tool.ruff.lint]
# # Add the `line-too-long` rule to the enforced rule set.
# extend-select = ["E501"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pathspec>=1.0.4",
    "pytest>=9.0.2",
]
